<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>ZXT Fight</title>
<style>
*{box-sizing:border-box;touch-action:none}
body{margin:0;background:#111;font-family:Arial;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;background:linear-gradient(#72c8ff 0 65%,#49a447 65%)}
#title{position:fixed;top:8px;width:100%;text-align:center;color:white;
font-size:28px;font-weight:bold;text-shadow:2px 2px #000}
.bar{position:fixed;top:48px;width:36%;height:20px;background:#ddd;
border:3px solid #111;border-radius:10px;overflow:hidden}
#playerBar{left:3%}#enemyBar{right:3%}
.fill{height:100%;background:#e22;width:100%}
.controls{position:fixed;bottom:15px;width:100%;display:flex;
justify-content:space-between;padding:0 12px}
button{width:65px;height:58px;border-radius:15px;border:2px solid #222;
background:#ffffffdd;font-weight:bold;font-size:11px}
#message{display:none;position:fixed;inset:0;background:#0009;color:white;
align-items:center;justify-content:center;text-align:center;
font-size:40px;font-weight:bold;white-space:pre-line}
</style>
</head>

<body>

<canvas id="game"></canvas>
<div id="title">⚔️ ZXT FIGHT ⚔️</div>

<div class="bar" id="playerBar"><div class="fill" id="pHealth"></div></div>
<div class="bar" id="enemyBar"><div class="fill" id="eHealth"></div></div>

<div class="controls">
  <div>
    <button id="left">⬅️ LEFT</button>
    <button id="right">RIGHT ➡️</button>
    <button id="jump">⬆️ JUMP</button>
  </div>
  <div>
    <button id="punch">👊 PUNCH</button>
    <button id="kick">🦵 KICK</button>
    <button id="block">🛡️ BLOCK</button>
  </div>
</div>

<div id="message"></div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

const player={
 x:150,y:0,w:45,h:90,hp:100,vy:0,
 speed:5,blocking:false,attack:0
};

const enemy={
 x:650,y:0,w:45,h:90,hp:100,
 speed:2.2,attack:0
};

let ground;
let gameOver=false;

function reset(){
  ground=H*0.65;
  player.x=W*0.25;
  enemy.x=W*0.72;
  player.y=ground-player.h;
  enemy.y=ground-enemy.h;
  player.hp=100;
  enemy.hp=100;
  player.vy=0;
  player.blocking=false;
  player.attack=0;
  enemy.attack=0;
  gameOver=false;
  document.getElementById("message").style.display="none";
}
reset();

const keys={};

function hold(button,key){
  const b=document.getElementById(button);
  b.onpointerdown=e=>{e.preventDefault();keys[key]=true};
  b.onpointerup=e=>{e.preventDefault();keys[key]=false};
  b.onpointercancel=()=>keys[key]=false;
  b.onpointerleave=()=>keys[key]=false;
}

hold("left","left");
hold("right","right");
hold("block","block");

document.getElementById("jump").onpointerdown=e=>{
  e.preventDefault();
  if(player.y>=ground-player.h-2) player.vy=-13;
};

document.getElementById("punch").onpointerdown=e=>{
  e.preventDefault();
  attackPlayer(10);
};

document.getElementById("kick").onpointerdown=e=>{
  e.preventDefault();
  attackPlayer(15);
};

function attackPlayer(damage){
  if(gameOver)return;

  player.attack=12;

  const distance=Math.abs(player.x-enemy.x);

  if(distance<115){
    enemy.hp=Math.max(0,enemy.hp-damage);

    if(enemy.hp<=0){
      endGame("🏆 VICTORY!\n\nTap screen to restart");
    }
  }
}

function enemyAI(){

  if(gameOver)return;

  const distance=player.x-enemy.x;

  if(Math.abs(distance)>85){
    enemy.x += Math.sign(distance)*enemy.speed;
  }else if(enemy.attack<=0){

    enemy.attack=45;

    if(!player.blocking){
      player.hp=Math.max(0,player.hp-8);

      if(player.hp<=0){
        endGame("💀 GAME OVER\n\nTap screen to restart");
      }
    }
  }
}

function endGame(text){
  gameOver=true;
  const msg=document.getElementById("message");
  msg.innerText=text;
  msg.style.display="flex";
}

document.getElementById("message").onclick=reset;

function drawFighter(o,color,flip=false){

  ctx.save();
  ctx.translate(o.x,o.y);

  if(flip)ctx.scale(-1,1);

  /* head */
  ctx.fillStyle="#222";
  ctx.beginPath();
  ctx.arc(o.w/2,18,17,0,Math.PI*2);
  ctx.fill();

  /* body */
  ctx.fillStyle=color;
  ctx.fillRect(5,35,o.w-10,38);

  /* legs */
  ctx.strokeStyle="#222";
  ctx.lineWidth=9;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(15,73);
  ctx.lineTo(8,88);
  ctx.moveTo(30,73);
  ctx.lineTo(38,88);
  ctx.stroke();

  /* arms */
  ctx.beginPath();

  if(o.attack>0){
    ctx.moveTo(35,43);
    ctx.lineTo(72,45);
  }else{
    ctx.moveTo(35,43);
    ctx.lineTo(48,58);
  }

  ctx.moveTo(10,43);
  ctx.lineTo(0,58);
  ctx.stroke();

  /* block shield */
  if(o.blocking){
    ctx.strokeStyle="#55f";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.arc(30,45,30,-1.2,1.2);
    ctx.stroke();
  }

  ctx.restore();
}

function update(){

  if(gameOver)return;

  if(keys.left)player.x-=player.speed;
  if(keys.right)player.x+=player.speed;

  player.x=Math.max(10,Math.min(W-player.w-10,player.x));

  player.vy+=0.6;
  player.y+=player.vy;

  if(player.y>=ground-player.h){
    player.y=ground-player.h;
    player.vy=0;
  }

  player.blocking=!!keys.block;

  if(player.attack>0)player.attack--;
  if(enemy.attack>0)enemy.attack--;

  enemyAI();
}

function draw(){

  ctx.clearRect(0,0,W,H);

  ground=H*0.65;

  ctx.fillStyle="#328b35";
  ctx.fillRect(0,ground,W,H-ground);

  drawFighter(player,"#2470d8");
  drawFighter(enemy,"#d93636",true);

  document.getElementById("pHealth").style.width=player.hp+"%";
  document.getElementById("eHealth").style.width=enemy.hp+"%";
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
